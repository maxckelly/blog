<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" role="img" font-family="'JetBrains Mono', 'SF Mono', monospace">
  <title>What happens when a member books a class</title>
  <desc>The app sends a booking with an idempotency key. The API checks eligibility and credit cost in Postgres, checks live availability with the destination studio's booking system where needed, places the booking there, then commits the credit spend, booking and event in one Postgres transaction before confirming to the app.</desc>
  <defs>
    <marker id="c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .head { fill: #141414; stroke: #3a3a3a; stroke-width: 1; }
    .core { fill: #0f1a12; stroke: #86efac; stroke-width: 1.25; }
    .t { fill: #d4d4d4; font-size: 12px; font-weight: 500; }
    .g { fill: #86efac; }
    .life { stroke: #2a2a2a; stroke-width: 1; stroke-dasharray: 3 4; }
    .m { stroke: #a3a3a3; stroke-width: 1.25; fill: none; }
    .r { stroke: #737373; stroke-width: 1.25; fill: none; stroke-dasharray: 4 3; }
    .lbl { fill: #d4d4d4; font-size: 11px; }
    .sub { fill: #737373; font-size: 10.5px; }
    .lock { fill: none; stroke: #86efac; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <!-- lane heads: x = 85, 255, 425, 595 -->
  <rect class="head" x="25" y="20" width="120" height="34" rx="6"/>
  <text class="t" x="85" y="42" text-anchor="middle">iOS app</text>
  <rect class="core" x="195" y="20" width="120" height="34" rx="6"/>
  <text class="t g" x="255" y="42" text-anchor="middle">api</text>
  <rect class="head" x="365" y="20" width="120" height="34" rx="6"/>
  <text class="t" x="425" y="42" text-anchor="middle">booking system</text>
  <rect class="core" x="535" y="20" width="120" height="34" rx="6"/>
  <text class="t g" x="595" y="42" text-anchor="middle">Postgres</text>

  <line class="life" x1="85" y1="54" x2="85" y2="400"/>
  <line class="life" x1="255" y1="54" x2="255" y2="400"/>
  <line class="life" x1="425" y1="54" x2="425" y2="400"/>
  <line class="life" x1="595" y1="54" x2="595" y2="400"/>

  <!-- 1 -->
  <text class="lbl" x="170" y="84" text-anchor="middle">1. book class</text>
  <line class="m" x1="85" y1="92" x2="252" y2="92" marker-end="url(#c-arrow)"/>
  <text class="sub" x="170" y="106" text-anchor="middle">+ idempotency key</text>

  <!-- 2 -->
  <text class="lbl" x="425" y="128" text-anchor="middle">2. eligible? enough credits? cost?</text>
  <line class="m" x1="255" y1="136" x2="592" y2="136" marker-end="url(#c-arrow)"/>
  <line class="r" x1="595" y1="156" x2="258" y2="156" marker-end="url(#c-arrow)"/>
  <text class="sub" x="425" y="170" text-anchor="middle">ok · 1.50 credits</text>

  <!-- 3: lock + live check -->
  <rect class="lock" x="240" y="186" width="200" height="56" rx="6"/>
  <text class="lbl" x="340" y="204" text-anchor="middle">3. live seat check*</text>
  <line class="m" x1="255" y1="212" x2="422" y2="212" marker-end="url(#c-arrow)"/>
  <text class="sub" x="340" y="234" text-anchor="middle">under a per-class lock</text>

  <!-- 4 -->
  <text class="lbl" x="340" y="266" text-anchor="middle">4. place booking</text>
  <line class="m" x1="255" y1="274" x2="422" y2="274" marker-end="url(#c-arrow)"/>
  <line class="r" x1="425" y1="292" x2="258" y2="292" marker-end="url(#c-arrow)"/>
  <text class="sub" x="340" y="306" text-anchor="middle">confirmed</text>

  <!-- 5 -->
  <text class="lbl" x="425" y="330" text-anchor="middle">5. place_booking()</text>
  <line class="m" x1="255" y1="338" x2="592" y2="338" marker-end="url(#c-arrow)"/>
  <text class="sub" x="425" y="352" text-anchor="middle">credit spend + booking + event, one transaction</text>

  <!-- 6 -->
  <line class="r" x1="255" y1="372" x2="88" y2="372" marker-end="url(#c-arrow)"/>
  <text class="sub" x="170" y="366" text-anchor="middle">booked</text>

  <text class="sub" x="25" y="420">* only for booking systems that don't refuse a full class themselves</text>
</svg>
